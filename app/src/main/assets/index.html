
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Wheel Arisan</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(145deg,#ffe4ef,#fff0f5,#f8e7ff);
 color:#873d65;
 text-align:center;
 padding:20px 14px;
}
h1{color:#d64f91;margin:10px 0}
.subtitle{color:#a66b89;font-size:14px}
.card{
 background:#ffffffd9;
 padding:18px;
 border-radius:24px;
 margin:18px auto;
 max-width:450px;
 box-shadow:0 8px 25px #d78bb52b;
}
canvas{
 width:100%;
 max-width:340px;
 height:auto;
}
.pointer{
 font-size:35px;
 margin-bottom:-12px;
 position:relative;
 z-index:2;
}
textarea{
 width:100%;
 height:110px;
 border:2px solid #f4bdd7;
 border-radius:15px;
 padding:12px;
 font-size:15px;
 outline:none;
 resize:vertical;
 color:#873d65;
 background:#fff8fb;
}
button{
 border:0;
 border-radius:30px;
 padding:13px 22px;
 margin:6px;
 font-weight:bold;
 font-size:15px;
 cursor:pointer;
}
.spin{
 background:linear-gradient(135deg,#ff77b7,#df4b98);
 color:white;
 font-size:21px;
 padding:16px 48px;
 box-shadow:0 5px 15px #e68bb9;
}
.secondary{background:#f9d5e7;color:#98456f}
#winner{
 font-size:22px;
 font-weight:bold;
 color:#dc4a91;
 margin:15px;
}
.small{font-size:12px;color:#b17b98}
</style>
</head>
<body>

<h1>🎀 Lucky Wheel 🎀</h1>
<div class="subtitle">Putar roda, tentukan pemenang arisan!</div>

<div class="card">
<h3>💗 Daftar Peserta</h3>
<textarea id="names" placeholder="Masukkan nama peserta, satu nama setiap baris">Ani
Budi
Citra
Dewi
Eka
Fani</textarea>
<br>
<button class="secondary" onclick="updateWheel()">Perbarui Peserta</button>
</div>

<div class="card">
<div class="pointer">▼</div>
<canvas id="wheel" width="600" height="600"></canvas>
<br>
<button class="spin" id="spin" onclick="spinWheel()">SPIN 🎡</button>
<div id="winner">Siapa yang beruntung? 💕</div>
<div class="small">Semoga beruntung!</div>
</div>

<div class="card">
<h3>🏆 Riwayat Pemenang</h3>
<div id="history">Belum ada pemenang</div>
<button class="secondary" onclick="resetHistory()">Hapus Riwayat</button>
</div>

<script>
const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
const colors=["#ff9fc8","#ffc6dc","#d9b9f5","#ffe0a8","#f6a9b9","#c9b8f0"];
let names=["Ani","Budi","Citra","Dewi","Eka","Fani"];
let angle=0;
let spinning=false;
let audio=null;
let lastTick=-1;
let history=[];

function sound(){
 if(!audio) audio=new(window.AudioContext||window.webkitAudioContext)();
 if(audio.state==="suspended")audio.resume();
}
function tone(freq,duration,type="sine",volume=.07){
 sound();
 const osc=audio.createOscillator();
 const gain=audio.createGain();
 osc.type=type;
 osc.frequency.value=freq;
 gain.gain.setValueAtTime(volume,audio.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
 osc.connect(gain);
 gain.connect(audio.destination);
 osc.start();
 osc.stop(audio.currentTime+duration);
}
function updateWheel(){
 const value=document.getElementById("names").value;
 names=value.split("\n").map(x=>x.trim()).filter(Boolean);
 if(names.length<2){
 alert("Masukkan minimal 2 nama peserta!");
 names=["Ani","Budi"];
 return;
 }
 angle=0;
 drawWheel();
 document.getElementById("winner").textContent="Siapa yang beruntung? 💕";
}
function drawWheel(){
 const n=names.length;
 const arc=Math.PI*2/n;
 ctx.clearRect(0,0,600,600);
 names.forEach((name,i)=>{
  const start=angle+i*arc-Math.PI/2;
  const end=start+arc;
  ctx.beginPath();
  ctx.moveTo(300,300);
  ctx.arc(300,300,280,start,end);
  ctx.closePath();
  ctx.fillStyle=colors[i%colors.length];
  ctx.fill();
  ctx.strokeStyle="#fff";
  ctx.lineWidth=5;
  ctx.stroke();
  ctx.save();
  ctx.translate(300,300);
  ctx.rotate(start+arc/2);
  ctx.textAlign="right";
  ctx.fillStyle="#783653";
  ctx.font="bold 22px Arial";
  ctx.fillText(name,255,8,220);
  ctx.restore();
 });
 ctx.beginPath();
 ctx.arc(300,300,43,0,Math.PI*2);
 ctx.fillStyle="#fff5fa";
 ctx.fill();
 ctx.strokeStyle="#f18bb9";
 ctx.lineWidth=6;
 ctx.stroke();
 ctx.fillStyle="#df5a9b";
 ctx.font="bold 22px Arial";
 ctx.textAlign="center";
 ctx.fillText("♥",300,308);
}
function spinWheel(){
 if(spinning)return;
 updateWheel();
 if(names.length<2)return;
 sound();
 spinning=true;
 document.getElementById("spin").disabled=true;
 document.getElementById("winner").textContent="Semoga beruntung! 💗";
 const start=angle;
 const extra=Math.PI*2*(5+Math.random()*4)+Math.random()*Math.PI*2;
 const duration=5500;
 const startTime=performance.now();
 lastTick=-1;
 function animate(now){
  const t=Math.min((now-startTime)/duration,1);
  const ease=1-Math.pow(1-t,4);
  angle=start+extra*ease;
  drawWheel();
  const tick=Math.floor(angle/(Math.PI*2/names.length)*2);
  if(tick!==lastTick){
   tone(700,.035,"square",.025);
   lastTick=tick;
  }
  if(t<1){
   requestAnimationFrame(animate);
  }else{
   spinning=false;
   document.getElementById("spin").disabled=false;
   const arc=Math.PI*2/names.length;
   let index=Math.floor((Math.PI*1.5-angle%(Math.PI*2)+Math.PI*2)%(Math.PI*2)/arc);
   const winner=names[index];
   document.getElementById("winner").textContent="🎉 PEMENANG: "+winner+" 🎉";
   history.unshift(winner);
   showHistory();
   tone(523,.3);
   setTimeout(()=>tone(659,.3),180);
   setTimeout(()=>tone(784,.5),360);
  }
 }
 requestAnimationFrame(animate);
}
function showHistory(){
 document.getElementById("history").innerHTML=history.length?
 history.map((n,i)=>`${i+1}. 🏆 ${n}`).join("<br>"):
 "Belum ada pemenang";
}
function resetHistory(){
 history=[];
 showHistory();
}
drawWheel();
</script>
</body>
</html>
