
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Wheel Arisan</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:20px 14px 35px;
 font-family:Arial,sans-serif;color:#725477;text-align:center;
 background:linear-gradient(145deg,#f4eaff,#ffeaf3,#e4f7f1);
}
h1{font-size:27px;color:#9875b9;margin:8px 0}
.sub{font-size:13px;color:#a28aa9}
.card{
 max-width:480px;margin:18px auto;padding:18px;
 border-radius:26px;background:#ffffffd9;
 border:1px solid #fff;box-shadow:0 10px 30px #9676a52b;
}
h3{margin:4px 0 12px;color:#9875b9}
.wheelbox{position:relative;max-width:360px;margin:auto}
canvas{width:100%;height:auto;display:block}
.pointer{
 position:absolute;top:-4px;left:50%;transform:translateX(-50%);
 z-index:2;font-size:38px;color:#bd81b5;
 text-shadow:0 3px 5px #9e679b66;
}
.spin{
 width:85%;max-width:280px;padding:17px;margin:15px auto;
 border:0;border-radius:35px;color:#fff;font-size:23px;
 font-weight:bold;
 background:linear-gradient(120deg,#d6a8e8,#ef9fc8,#a9d8cd);
 box-shadow:0 7px 18px #b58ab966;
}
.spin:disabled{opacity:.5}
button{cursor:pointer}
.secondary{
 border:0;border-radius:25px;padding:12px 18px;margin:5px;
 color:#795a83;background:#f1dff5;font-weight:bold;
}
textarea{
 width:100%;height:180px;padding:13px;
 border:2px solid #ead5f1;border-radius:16px;
 background:#fffaff;color:#765779;font-size:15px;
}
#winner{
 padding:13px;border-radius:18px;
 background:#fff0f7;color:#c45d99;
 font-size:20px;font-weight:bold;min-height:52px;
}
#remaining{font-size:14px;color:#987ba0;margin-top:12px}
#status{font-size:13px;color:#a68aaa;margin:10px}
.footer{font-size:12px;color:#ad97b1;margin-top:18px}
</style>
</head>
<body>

<h1>🎀 LUCKY WHEEL 🎀</h1>
<div class="sub">Pastel Luxury • Arisan Edition</div>

<div class="card">
 <h3>🌸 Roda Keberuntungan 🌸</h3>
 <div class="wheelbox">
  <div class="pointer">▼</div>
  <canvas id="wheel" width="700" height="700"></canvas>
 </div>
 <button class="spin" id="spin" onclick="spinWheel()">PUTAR ✨</button>
 <div id="winner">Siapakah pemenang berikutnya? 💗</div>
 <div id="remaining">Sisa peserta: 11</div>
 <div id="status">3 pemenang pertama mengikuti urutan tetap</div>
</div>

<div class="card">
 <h3>💗 Pengaturan Peserta</h3>
 <textarea id="names"></textarea>
 <br>
 <button class="secondary" onclick="applyNames()">Simpan Daftar Nama</button>
 <button class="secondary" onclick="resetAll()">Reset Arisan</button>
</div>

<div class="footer">Made with love 💕 Lucky Wheel Arisan</div>

<script>
const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

const originalNames=[
"Aluna","Hari","Caca","Cahya","M.Arsyad",
"Evi","Hildan","Amel","Teh nay","Alfita","Pak eko"
];

const fixedWinners=["Aluna","Hari","Caca"];

const colors=[
"#e8c9f4","#f8c7dd","#c9e9e0",
"#ffe0bd","#c8def5","#f2d5e9",
"#d8d0f5","#f9d9b9","#c7e8ee",
"#f5c6d8","#e5d6f5"
];

let participants=[...originalNames];
let winnerCount=0;
let angle=0;
let spinning=false;
let audio=null;
let lastTick=-1;

document.getElementById("names").value=originalNames.join("\n");

function sound(){
 if(!audio){
  audio=new(window.AudioContext||window.webkitAudioContext)();
 }
 if(audio.state==="suspended")audio.resume();
}

function tone(freq,duration=.08,type="sine",volume=.05){
 sound();
 const osc=audio.createOscillator();
 const gain=audio.createGain();
 osc.type=type;
 osc.frequency.value=freq;
 gain.gain.setValueAtTime(volume,audio.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
 osc.connect(gain);
 gain.connect(audio.destination);
 osc.start();
 osc.stop(audio.currentTime+duration);
}

function drawWheel(){
 const n=participants.length;
 ctx.clearRect(0,0,700,700);

 if(!n){
  ctx.beginPath();
  ctx.arc(350,350,320,0,Math.PI*2);
  ctx.fillStyle="#eee0f3";
  ctx.fill();
  ctx.fillStyle="#9875b9";
  ctx.font="bold 25px Arial";
  ctx.textAlign="center";
  ctx.fillText("ARISAN SELESAI 💗",350,360);
  return;
 }

 const arc=Math.PI*2/n;

 ctx.save();
 ctx.translate(350,350);

 ctx.beginPath();
 ctx.arc(0,0,337,0,Math.PI*2);
 ctx.fillStyle="#d4a8d7";
 ctx.fill();

 for(let i=0;i<28;i++){
  const a=i*Math.PI*2/28;
  ctx.beginPath();
  ctx.arc(Math.cos(a)*326,Math.sin(a)*326,8,0,Math.PI*2);
  ctx.fillStyle=i%2?"#fff4cf":"#ffffff";
  ctx.fill();
 }

 for(let i=0;i<n;i++){
  const start=angle-Math.PI/2+i*arc;
  const end=start+arc;

  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.arc(0,0,315,start,end);
  ctx.closePath();
  ctx.fillStyle=colors[i%colors.length];
  ctx.fill();
  ctx.strokeStyle="#fff";
  ctx.lineWidth=5;
  ctx.stroke();

  ctx.save();
  ctx.rotate(start+arc/2);
  ctx.textAlign="right";
  ctx.fillStyle="#725477";
  ctx.font="bold 22px Arial";
  ctx.fillText(participants[i],285,8,245);
  ctx.restore();
 }

 ctx.beginPath();
 ctx.arc(0,0,57,0,Math.PI*2);
 ctx.fillStyle="#fff7fb";
 ctx.fill();
 ctx.lineWidth=8;
 ctx.strokeStyle="#d8b3e4";
 ctx.stroke();
 ctx.fillStyle="#d28ab6";
 ctx.font="bold 34px Arial";
 ctx.textAlign="center";
 ctx.fillText("♥",0,12);

 ctx.restore();
}

function updateInfo(){
 document.getElementById("remaining").textContent=
 "Sisa peserta: "+participants.length;
 document.getElementById("names").value=participants.join("\n");
}

function applyNames(){
 if(spinning)return;

 const list=document.getElementById("names").value
 .split("\n").map(x=>x.trim()).filter(Boolean);

 if(list.length<3){
  alert("Masukkan minimal 3 nama!");
  return;
 }

 if(new Set(list).size!==list.length){
  alert("Ada nama yang sama. Periksa daftar peserta ya!");
  return;
 }

 const missing=fixedWinners.filter(name=>!list.includes(name));

 if(missing.length){
  alert("Nama pemenang wajib tidak boleh dihapus: "+missing.join(", "));
  document.getElementById("names").value=participants.join("\n");
  return;
 }

 participants=list;
 winnerCount=0;
 angle=0;

 drawWheel();
 updateInfo();

 document.getElementById("winner").textContent=
 "Daftar peserta berhasil disimpan 💗";

 document.getElementById("status").textContent=
 "Aluna, Hari, Caca tetap menjadi 3 pemenang pertama";
 document.getElementById("spin").disabled=false;
}

function resetAll(){
 if(spinning)return;

 if(!confirm("Mulai ulang arisan dengan daftar nama awal?"))return;

 participants=[...originalNames];
 winnerCount=0;
 angle=0;

 drawWheel();
 updateInfo();

 document.getElementById("winner").textContent=
 "Siapakah pemenang berikutnya? 💗";

 document.getElementById("status").textContent=
 "Urutan pemenang diulang dari awal";

 document.getElementById("spin").disabled=false;
}

function spinWheel(){
 if(spinning||participants.length===0)return;

 sound();

 let winner;

 if(winnerCount<3){
  winner=fixedWinners[winnerCount];

  if(!participants.includes(winner)){
   alert("Nama pemenang wajib tidak ditemukan!");
   return;
  }
 }else{
  winner=participants[
   Math.floor(Math.random()*participants.length)
  ];
 }

 winnerCount++;
 spinning=true;
 document.getElementById("spin").disabled=true;

 const index=participants.indexOf(winner);
 const n=participants.length;
 const arc=Math.PI*2/n;

 const target=(
  (Math.PI*2-(index+.5)*arc)%(Math.PI*2)+Math.PI*2
 )%(Math.PI*2);

 const current=((angle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
 const distance=5*Math.PI*2+
 ((target-current+Math.PI*2)%(Math.PI*2));

 const start=angle;
 const duration=8000;
 const startTime=performance.now();
 lastTick=-1;

 function animate(now){
  const t=Math.min((now-startTime)/duration,1);
  const ease=1-Math.pow(1-t,4);

  angle=start+distance*ease;
  drawWheel();

  const tick=Math.floor(angle/(Math.PI*2/n)*1.5);

  if(tick!==lastTick){
   tone(650,.045,"square",.025);
   lastTick=tick;
  }

  if(t<1){
   requestAnimationFrame(animate);
  }else{
   document.getElementById("winner").textContent=
   "🏆 SELAMAT! "+winner+" 🏆";

   let remaining=10;

   document.getElementById("status").textContent=
   "Nama akan dihapus dalam 10 detik";

   tone(523,.35,"sine",.1);
   setTimeout(()=>tone(659,.35,"sine",.1),200);
   setTimeout(()=>tone(784,.55,"sine",.1),400);

   const countdownTimer=setInterval(()=>{
    remaining--;

    if(remaining>0){
     document.getElementById("status").textContent=
     "Nama akan dihapus dalam "+remaining+" detik";
    }else{
     clearInterval(countdownTimer);

     participants=participants.filter(name=>name!==winner);

     drawWheel();
     updateInfo();

     document.getElementById("status").textContent=
     participants.length
     ?"Pemenang sudah dihapus. Siap untuk putaran berikutnya 💗"
     :"Semua peserta sudah mendapatkan giliran! 🎉";

     spinning=false;
     document.getElementById("spin").disabled=
     participants.length===0;
    }
   },1000);
  }
 }

 requestAnimationFrame(animate);
}

drawWheel();
updateInfo();
</script>
</body>
</html>
